# Runs on every push and pull request, and is also CALLED by deploy-aws.yml so the AWS deploy
# waits for exactly the same checks. Three independent jobs:
#   site:      build the site, then fail on any regression - HTML structure on every built page,
#              Lighthouse on every page (desktop), and layout shift on a throttled phone
#   api:       run the FastAPI test suite
#   container: boot the API image exactly as Cloud Run does
# Cloudflare deploys `main` without waiting for this workflow, so a ruleset on `main` requires these
# checks to have passed on a commit before it can be pushed there (see CLAUDE.md).

name: CI

on:
  push:
    branches: [main, aws, "design/**", "fix/**"]
  pull_request:
  # Started explicitly by alerts.yml on its side branch: pushes made with a workflow's own token
  # trigger nothing, so this is how the daily advisory update gets tested before reaching main.
  workflow_dispatch:
  workflow_call:
    inputs:
      public_api_url:
        description: "API URL to build the site with. deploy-aws.yml passes /api, so CI tests the build AWS ships."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  site:
    name: Build site + accessibility gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          PUBLIC_API_URL: ${{ inputs.public_api_url || vars.PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: HTML structure audit (fails on regressions)
        working-directory: .
        run: |
          pip install --quiet beautifulsoup4 lxml
          python tools/audit.py --gate

      # Every page, in both languages - it used to be three. Layout shift is gated too (0.1 is
      # Google's "good" threshold): widening this check is what found the header badge pushing the
      # page down 13px on desktop (CLS 0.13 on Citizen Services) in October 2026.
      # The 404 page is left out on purpose: it is noindex, so it correctly fails the SEO score.
      # Its structure is still covered by the HTML audit above.
      - name: Lighthouse gate, desktop, every page (a11y 100, best practices and SEO >= 90, CLS <= 0.1)
        working-directory: .
        run: |
          (cd site && npx astro preview --port 4321 &)
          sleep 5
          B=http://localhost:4321
          node tools/lighthouse-gate.mjs --max-cls=0.1 \
            $B/ $B/visas/ $B/citizen-services/ $B/education/ $B/search/ $B/ask/ $B/feedback/ \
            $B/az/ $B/az/visas/ $B/az/citizen-services/ $B/az/education/ $B/az/search/ $B/az/ask/ $B/az/feedback/

      # A phone on a really slow network. Lighthouse's default simulated throttling replays a fast
      # local load, in which the fonts arrive instantly - so the font reflow that took mobile CLS from
      # 0 to 0.25 never appeared. This is the check that would have caught it.
      - name: Lighthouse gate, mobile with real throttling (layout shift <= 0.1)
        working-directory: .
        run: |
          B=http://localhost:4321
          node tools/lighthouse-gate.mjs --mobile --max-cls=0.1 $B/ $B/visas/ $B/citizen-services/

      - name: Keep the reports as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            audit/report.md
            audit/lighthouse-ci/*.json
          retention-days: 14

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  container:
    name: API container boots (what Cloud Run runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image exactly as Cloud Run does
        run: docker build -t embassy-api api
      - name: Start it and hit the health endpoints
        run: |
          docker run -d --rm -p 8080:8080 --name api embassy-api
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ask/status | grep -q '"enabled":false'
          docker logs api
          docker stop api
