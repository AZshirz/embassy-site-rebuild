# CI: HTML audit + Lighthouse on every page + a throttled phone, FastAPI tests, container boot.
# A ruleset on `main` requires these three jobs to have passed before a commit can land there, and
# deploy-aws.yml calls this workflow so AWS runs the same checks on the build it ships.

name: CI

on:
  push:
    branches: [main, "design/**", "fix/**"]
  pull_request:
  # Started explicitly by alerts.yml on its side branch: pushes made with a workflow's own token
  # trigger nothing, so this is how the daily advisory update gets tested before reaching main.
  workflow_dispatch:
  workflow_call:
    inputs:
      public_api_url:
        description: "API URL to build the site with. deploy-aws.yml passes /api, so CI tests the build AWS ships."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  site:
    name: Build site + accessibility gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          PUBLIC_API_URL: ${{ inputs.public_api_url || vars.PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: HTML audit
        working-directory: .
        run: |
          pip install --quiet beautifulsoup4 lxml
          python tools/audit.py --gate

      # All indexable pages, both languages, with a CLS budget of 0.1 (Google's "good" threshold).
      # The 404 page is noindex, so it correctly fails SEO; the HTML audit above still covers it.
      - name: Lighthouse, desktop, every page
        working-directory: .
        run: |
          (cd site && npx astro preview --port 4321 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          B=http://localhost:4321
          node tools/lighthouse-gate.mjs --max-cls=0.1 \
            $B/ $B/visas/ $B/citizen-services/ $B/education/ $B/search/ $B/ask/ $B/feedback/ \
            $B/az/ $B/az/visas/ $B/az/citizen-services/ $B/az/education/ $B/az/search/ $B/az/ask/ $B/az/feedback/

      # Phone with real network throttling. The default simulated throttling misses font reflow,
      # which took mobile CLS from 0 to 0.25 once with every other check green.
      - name: Lighthouse, phone, throttled network
        working-directory: .
        run: |
          B=http://localhost:4321
          node tools/lighthouse-gate.mjs --mobile --max-cls=0.1 $B/ $B/visas/ $B/citizen-services/

      # When deploy-aws.yml calls this workflow, hand it the exact build that just passed, so AWS
      # ships what was tested instead of building it again.
      - name: Keep the build for the AWS deploy
        if: inputs.public_api_url == '/api'
        uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-reports
          path: |
            audit/report.md
            audit/lighthouse-ci/*.json
          retention-days: 14

  api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  container:
    name: API container boots (what Cloud Run runs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t embassy-api api
      - name: Start it and check it answers
        run: |
          docker run -d --rm -p 8080:8080 --name api embassy-api
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ask/status | grep -q '"enabled":false'
          docker logs api
          docker stop api
