# Daily: check travel.state.gov for an advisory-level change for Azerbaijan and, if there is one,
# commit alerts.json so both sites redeploy with the new strip.
#
# Publishing takes three steps because the ruleset on `main` refuses commits CI hasn't passed on,
# and this job's own push can't trigger CI. So: push to a side branch, start CI there with
# workflow_dispatch (the only event this token may trigger), wait, then push the same tested commit
# to `main`. Tick "rehearse" on a manual run to walk the path without changing anything.

name: Update travel advisory

on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC daily (an odd minute avoids the top-of-the-hour rush)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      rehearse:
        description: "Rehearse the publish path (side branch, CI, wait) without changing main"
        type: boolean
        default: false

permissions:
  contents: write    # push the update
  actions: write     # start CI on the side branch and read its result

concurrency:
  group: advisory-update
  cancel-in-progress: false

jobs:
  check-feed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the State Department feed
        run: python tools/fetch_alerts.py

      - name: Test the update, then push it to main
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail

          if git diff --quiet -- site/src/data/alerts.json api/data/alerts.json; then
            if [ "$REHEARSE" != "true" ]; then
              echo "No change to alerts.json; nothing to commit."
              exit 0
            fi
            echo "Rehearsal with no real change: CI will run on main's current commit; nothing is published."
          else
            LEVEL=$(python -c "import json; print(json.load(open('site/src/data/alerts.json'))['advisory']['level'])")
            DATE=$(python -c "import json; print(json.load(open('site/src/data/alerts.json'))['advisory']['published'])")
            # Commit as the repository owner, not as github-actions[bot]. A bot author would show up
            # permanently in GitHub's contributor list the first day the advisory changes, and this
            # project is deliberately single-author.
            git config user.name "Adam Shirzadian"
            git config user.email "330568160+AZshirz@users.noreply.github.com"
            git add site/src/data/alerts.json api/data/alerts.json
            git commit -m "chore(alerts): Azerbaijan travel advisory is Level ${LEVEL} (travel.state.gov, ${DATE})"
          fi

          SHA=$(git rev-parse HEAD)
          BRANCH="advisory/update-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          cleanup() { git push origin --delete "${BRANCH}" >/dev/null 2>&1 || true; }

          # That push starts no workflow on its own (it was made with this run's token), so start CI.
          gh workflow run ci.yml --ref "${BRANCH}"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow ci.yml --branch "${BRANCH}" --event workflow_dispatch \
                       --json databaseId,headSha --jq ".[] | select(.headSha == \"${SHA}\") | .databaseId" | head -n 1)
            [ -n "${RUN_ID}" ] && break
            sleep 10
          done
          if [ -z "${RUN_ID}" ]; then
            echo "CI never started on ${BRANCH}; main is unchanged."
            cleanup
            exit 1
          fi

          echo "Waiting for CI run ${RUN_ID} on ${SHA}"
          if ! gh run watch "${RUN_ID}" --exit-status --interval 30; then
            echo "CI failed on the advisory update; main is unchanged. See run ${RUN_ID}."
            cleanup
            exit 1
          fi
          cleanup     # the passed checks stay attached to the commit, not to the branch

          if [ "$REHEARSE" = "true" ]; then
            echo "Rehearsal passed: side branch, CI and wait all work. Nothing was published."
            exit 0
          fi

          # CI has passed on this exact commit, so the ruleset on main accepts it.
          git push origin "HEAD:main"
          echo "Published ${SHA} to main."
          # Cloudflare and Cloud Run deploy from the push. The AWS deploy is a workflow, which a
          # push made with this token can't start, so start it explicitly.
          gh workflow run deploy-aws.yml --ref main
