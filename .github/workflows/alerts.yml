# Daily check of the State Department travel-advisory feed.
#
# What it does: runs tools/fetch_alerts.py. If Azerbaijan's advisory level or date changed,
# it commits the update to alerts.json (site copy + API fallback copy) as github-actions[bot] and pushes.
# That push triggers the normal Cloudflare build, so the live site's alert strip updates itself.
#
# What it does NOT do: commit anything when nothing changed (most days). The only trace of a
# quiet run is this workflow's log, which GitHub deletes after 90 days.

name: Update travel advisory

on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC daily (an odd minute avoids the top-of-the-hour rush)
  workflow_dispatch:         # "Run workflow" button in the Actions tab, for manual checks

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read the feed and update alerts.json if needed
        run: python tools/fetch_alerts.py

      - name: Commit and push only if the file changed
        run: |
          if git diff --quiet -- site/src/data/alerts.json api/data/alerts.json; then
            echo "No change to alerts.json; nothing to commit."
            exit 0
          fi
          LEVEL=$(python -c "import json; print(json.load(open('site/src/data/alerts.json'))['advisory']['level'])")
          DATE=$(python -c "import json; print(json.load(open('site/src/data/alerts.json'))['advisory']['published'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/alerts.json api/data/alerts.json
          git commit -m "chore(alerts): Azerbaijan travel advisory is Level ${LEVEL} (travel.state.gov, ${DATE})"
          git push
