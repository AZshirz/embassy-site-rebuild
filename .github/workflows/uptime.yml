# Daily check that both live sites and both APIs answer. If anything is down the run fails, and
# GitHub emails the owner. On 2026-10-04 the Cloud Run API had been refusing every request for an
# unknown length of time before anyone noticed; this is what would have noticed.

name: Live check

on:
  schedule:
    - cron: "41 7 * * *"     # 07:41 UTC daily, after the advisory job
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check both sites and both APIs
        run: |
          set -u
          CF=https://embassy-site-rebuild.ashirz.workers.dev
          AWS=https://d19v507gh8thmt.cloudfront.net
          RUN=https://embassy-api-394144127807.us-east4.run.app
          fail=0
          # Fetch a URL (retrying, since an idle API takes a few seconds to start) and require a string in it.
          expect() {
            if curl -sf --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$1" | grep -q "$2"; then
              echo "ok    $1"
            else
              echo "FAIL  $1 (expected: $2)"; fail=1
            fi
          }
          for site in "$CF" "$AWS"; do
            expect "$site/" "U.S. Embassy in Azerbaijan"
            expect "$site/az/" "ABŞ"
            expect "$site/visas/" "U.S. Visas"
          done
          expect "$RUN/health" '"status":"ok"'
          expect "$AWS/api/health" '"status":"ok"'
          expect "$RUN/search?q=passport" '"count"'
          expect "$AWS/api/search?q=passport" '"count"'

          # Both sites should serve the same build. Different stylesheet hashes mean one deploy is behind.
          css() { curl -sf --max-time 30 "$1/" | grep -o 'site\.css?v=[0-9a-f]*' | head -1; }
          if [ "$(css "$CF")" != "$(css "$AWS")" ]; then
            echo "FAIL  the sites serve different builds: $(css "$CF") vs $(css "$AWS")"; fail=1
          fi
          exit $fail
